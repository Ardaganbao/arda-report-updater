# A tag v1.2.3 publishes release 1.2.3 with arda-report-updater.zip, which WordPress installs as an
# update (via the companion's own plugin-update-checker). A suffixed tag (v1.2.3-rc.1) is a pre-release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          version=$(grep -m1 -E '^\s*\*\s*Version:' arda-report-updater.php | sed -E 's/.*Version:\s*//' | tr -d '\r ')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match 'Version: $version' in arda-report-updater.php"
            exit 1
          fi

      # The zip holds an arda-report-updater folder, the plugin's folder on the sites, so they update in place.
      - name: Build arda-report-updater.zip
        run: |
          mkdir -p dist/arda-report-updater
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'dist' ./ dist/arda-report-updater/
          cd dist && zip -qr arda-report-updater.zip arda-report-updater

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/arda-report-updater.zip --title "$GITHUB_REF_NAME" --generate-notes $prerelease
